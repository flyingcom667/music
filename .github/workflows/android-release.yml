name: Android APK Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create or publish (for example, v1.0.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"

      - name: Build release APKs
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare release files
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk release-apks/audiofy-v8.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/app-arm64-v8a-release.apk release-apks/audiofy-v8.apk
          cp app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk release-apks/audiofy-v7.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/app-armeabi-v7a-release.apk release-apks/audiofy-v7.apk
          cp app/build/outputs/apk/release/app-universal-release-unsigned.apk release-apks/audiofy-universal.apk 2>/dev/null || \
          cp app/build/outputs/apk/release/app-universal-release.apk release-apks/audiofy-universal.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: Audiofy ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          files: release-apks/*.apk
