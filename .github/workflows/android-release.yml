name: Android APK Release

# Builds Audiofy on Linux for a pushed tag (e.g. v1.3.0) and publishes installable
# APKs on a GitHub Release.
#
# Two signing paths:
#
# 1. Committed signed assets (used when the release cannot be signed in CI):
#    place locally-signed APKs in  release-assets/<tag>/  and push the tag. CI verifies
#    each APK with apksigner (a build is skipped) and attaches them to the release.
#    The keystore itself never leaves the local machine.
#
# 2. CI signing via repository secrets (Settings → Secrets and variables → Actions):
#      KEYSTORE_BASE64   - the keystore, base64-encoded (base64 -w0 keystore/*.jks)
#      KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
#    When the secrets are set, the workflow builds from source and signs in CI.
#    When they are missing, the build still runs and publishes UNSIGNED APKs with a
#    loud warning (unsigned APKs do not install on Android).

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create or publish (for example, v1.3.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Resolve release tag and committed assets
        id: assets
        env:
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if ls release-assets/"$TAG"/*.apk >/dev/null 2>&1; then
            echo "committed=true" >> "$GITHUB_OUTPUT"
            echo "Using pre-signed APKs committed in release-assets/$TAG"
          else
            echo "committed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java 21
        if: steps.assets.outputs.committed != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # The ubuntu-latest image already ships the Android SDK with licenses accepted;
      # android-actions/setup-android@v3 is skipped on purpose: it runs `sdkmanager tools`,
      # a package Google removed from the repository, and fails the job.
      - name: Accept Android SDK licenses
        if: steps.assets.outputs.committed != 'true'
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Restore release signing
        if: steps.assets.outputs.committed != 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/tidalmusic-release.jks
            cat > keystore/keystore.properties <<PROPS
          storeFile=keystore/tidalmusic-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_* secrets are not set - the built APKs will be UNSIGNED and will NOT install. Use committed release-assets or set the secrets."
          fi

      - name: Build release APKs
        if: steps.assets.outputs.committed != 'true'
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Gather and verify release APKs
        env:
          TAG: ${{ steps.assets.outputs.tag }}
        run: |
          mkdir -p release-apks
          if [ "${{ steps.assets.outputs.committed }}" = "true" ]; then
            cp release-assets/"$TAG"/*.apk release-apks/
          else
            for abi in arm64-v8a armeabi-v7a universal; do
              src=$(ls app/build/outputs/apk/release/app-${abi}-release*.apk 2>/dev/null | head -1)
              [ -n "$src" ] || { echo "::error::missing APK for $abi"; exit 1; }
              cp "$src" "release-apks/Audiofy-${TAG}-${abi}.apk"
            done
          fi
          # Every published APK must carry a real signature - fail loudly otherwise.
          APKSIGNER=$(ls /usr/local/lib/android/sdk/build-tools/*/apksigner | sort -V | tail -1)
          for apk in release-apks/*.apk; do
            "$APKSIGNER" verify "$apk" || {
              echo "::error::$apk is not properly signed and would not install"
              exit 1
            }
          done
          ls -la release-apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.assets.outputs.tag }}
          name: Audiofy ${{ steps.assets.outputs.tag }}
          body: |
            Installable APKs of Audiofy ${{ steps.assets.outputs.tag }}.

            - **Audiofy-*-arm64-v8a.apk** — modern 64-bit phones (use this on almost every phone sold since ~2017)
            - **Audiofy-*-armeabi-v7a.apk** — older 32-bit phones
            - **Audiofy-*-universal.apk** — works on every device (larger download)
          generate_release_notes: true
          files: release-apks/*.apk
          fail_on_unmatched_files: true
