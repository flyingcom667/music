name: Android APK Release

# Builds the signed release APKs on Linux for a pushed tag (e.g. v1.2.3) and publishes
# them on a GitHub Release so users can download them.
#
# Signing expects these repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64     - the release keystore, base64-encoded
#                         (create locally with: base64 -w0 keystore/tidalmusic-release.jks)
#   KEYSTORE_PASSWORD   - the keystore password
#   KEY_ALIAS           - the key alias (tidalmusic)
#   KEY_PASSWORD        - the key password
# When the secrets are missing the APKs are published unsigned and the run warns —
# unsigned APKs do NOT install on Android, so set the secrets for real releases.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create or publish (for example, v1.2.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/tidalmusic-release.jks
            cat > keystore/keystore.properties <<PROPS
          storeFile=keystore/tidalmusic-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_* secrets are not set - publishing UNSIGNED APKs that will NOT install. Set the secrets and re-run."
          fi

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Prepare release files
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          mkdir -p release-apks
          for abi in arm64-v8a armeabi-v7a universal; do
            src=$(ls app/build/outputs/apk/release/app-${abi}-release*.apk 2>/dev/null | head -1)
            [ -n "$src" ] || { echo "::error::missing APK for $abi"; exit 1; }
            cp "$src" "release-apks/Audiofy-${TAG}-${abi}.apk"
          done
          ls -la release-apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: Audiofy ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          body: |
            Installable APKs of Audiofy ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}.

            - **Audiofy-*-arm64-v8a.apk** — modern 64-bit phones (use this on almost every phone sold since ~2017)
            - **Audiofy-*-armeabi-v7a.apk** — older 32-bit phones
            - **Audiofy-*-universal.apk** — works on every device (larger download)
          generate_release_notes: true
          files: release-apks/*.apk
          fail_on_unmatched_files: true
