name: Android APK Release

# Builds the signed release APKs for a pushed tag (e.g. v1.2.0) and publishes them
# on a GitHub Release, so users can download them directly.
#
# Signing: the workflow expects these repository secrets (Settings → Secrets and
# variables → Actions):
#   KEYSTORE_BASE64     - the release keystore, base64-encoded
#                         (generate locally with: base64 -w0 keystore/tidalmusic-release.jks)
#   KEYSTORE_PASSWORD   - the keystore password
#   KEY_ALIAS           - the key alias (tidalmusic)
#   KEY_PASSWORD        - the key password
# When the secrets are missing the APKs are published unsigned and the release
# notes say so.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Tag to create or publish (for example, v1.2.0)
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Restore release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            mkdir -p keystore
            echo "$KEYSTORE_BASE64" | base64 -d > keystore/tidalmusic-release.jks
            cat > keystore/keystore.properties <<PROPS
          storeFile=keystore/tidalmusic-release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "SIGNED=false" >> "$GITHUB_ENV"
            echo "::warning::KEYSTORE_* secrets are not set - publishing UNSIGNED APKs."
          fi

      - name: Build release APKs
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Prepare release files
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          mkdir -p release-apks
          for abi in arm64-v8a armeabi-v7a universal; do
            src=$(ls app/build/outputs/apk/release/app-${abi}-release*.apk 2>/dev/null | head -1)
            [ -n "$src" ] || { echo "missing APK for $abi"; exit 1; }
            cp "$src" "release-apks/TidalMusic-${TAG}-${abi}.apk"
          done
          ls -la release-apks/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          name: Tidal Music ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          body: |
            Installable APKs of Tidal Music ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}.

            - **TidalMusic-*-arm64-v8a.apk** — modern 64-bit phones (use this on almost every phone sold since ~2017)
            - **TidalMusic-*-armeabi-v7a.apk** — older 32-bit phones
            - **TidalMusic-*-universal.apk** — works on every device (larger download)
          generate_release_notes: true
          files: release-apks/*.apk
