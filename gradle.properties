org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# KSP registers its generated sources through the kotlin.sourceSets DSL. The Android Gradle
# plugin 9 ships built-in Kotlin support and rejects that by default, so the check is relaxed
# here; the KSP output still ends up in the compilation unit.
android.disallowKotlinSourceSets=false


android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

kotlin.code.style=official
